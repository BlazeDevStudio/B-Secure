<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locked — B Secure</title><link rel="icon" href="assets/bsecure-z-48.png"><link rel="stylesheet" href="theme.css"></head>
<body class="lock-page"><main class="lock-wrap">
<header class="brand lock-brand"><img class="brand-symbol" src="assets/bsecure-lock-mark.svg" alt="" width="42" height="42"><span class="brand-main">B Secure</span></header>
<section class="panel lock-panel" id="lock-panel">
<div class="hero-symbol lock-hero" id="hero-symbol" aria-hidden="true"><span class="lock-graphic"><span class="shackle"></span><span class="body"></span><span class="keyhole"></span></span></div>
<h1>Locked</h1><p class="attempts" id="attempts" hidden></p>
<form id="unlock-form" class="fields"><div class="field"><label for="password">Password</label><div class="control"><input id="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Enter password" required autofocus><button class="peek" type="button" data-for="password">Show</button></div></div><p id="caps" class="help" hidden>Caps Lock is on.</p><p id="message" class="alert" role="status" aria-live="polite" hidden></p><button class="btn full" id="unlock" type="submit">Unlock</button></form>
</section><p class="lock-bottom">B Secure · L.C.Manreal</p></main>
<script src="ui.js" defer></script><script src="lock.js" defer></script></body></html>
